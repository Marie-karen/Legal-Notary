title = "Configuration Gitleaks — Legal Notary"

[extend]
useDefault = true

[[rules]]
id = "generic-fallback-secret-hex"
description = "Chaîne hexadécimale de 32 caractères ou plus utilisée comme valeur de repli d'un secret (Section 15 bis & S04)"
regex = '''(?i)(?:JWT_SECRET|CLE_CHIFFREMENT|SECRET_KEY|SECRET)\s*(?:=|\|\|)\s*['\"][a-f0-9]{32,}['\"]'''
keywords = [
    "JWT_SECRET",
    "CLE_CHIFFREMENT",
    "SECRET_KEY",
    "SECRET",
]
entropy = 3.0
