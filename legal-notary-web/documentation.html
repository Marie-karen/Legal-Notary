<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Notary — Manuels Interactifs & Guides Métiers Personnalisés</title>
  <meta name="description" content="Centre de manuels interactifs personnalisés par rôle (Notaire, Clercs, Comptable, Formaliste, Archiviste) inspiré des standards Glitter.io / ISO 26514:2022.">

  <!-- Polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.4.2">

  <script>
    (function () {
      var theme = "dark";
      try { theme = localStorage.getItem("legal_notary_theme") || "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .doc-nav-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
    }

    .doc-layout {
      display: flex;
      max-width: 1440px;
      margin: 0 auto;
      min-height: calc(100vh - 65px);
    }

    .doc-sidebar {
      width: 320px;
      border-right: 1px solid var(--color-border);
      padding: 24px 16px;
      position: sticky;
      top: 65px;
      height: calc(100vh - 65px);
      overflow-y: auto;
      background: var(--color-surface-2);
      flex-shrink: 0;
    }

    .doc-content {
      flex: 1;
      padding: 36px 48px;
      max-width: 960px;
    }

    @media (max-width: 900px) {
      .doc-layout {
        flex-direction: column;
      }
      .doc-sidebar {
        width: 100%;
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding: 16px 14px;
      }
      .doc-content {
        padding: 20px 14px 40px;
      }
      .doc-nav-header {
        padding: 10px 14px;
      }
      .prose h1 {
        font-size: 24px !important;
      }
    }

    .role-selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .role-pill-btn {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-dim);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .role-pill-btn:hover {
      border-color: #38bdf8;
      color: var(--color-text);
      transform: translateY(-1px);
    }

    .role-pill-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.2));
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }

    .glitter-step-card {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      transition: all 0.2s ease;
    }

    .glitter-step-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .step-number-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #38bdf8;
      color: #0b0f19;
      font-weight: 800;
      font-size: 15px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .step-header {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }

    .step-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
    }

    .step-screenshot-mockup {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: #94a3b8;
      position: relative;
      overflow-x: auto;
    }

    .step-screenshot-mockup .cursor-pointer-hint {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .interactive-checklist {
      list-style: none;
      padding: 0;
      margin: 14px 0;
    }

    .interactive-checklist li {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .interactive-checklist li:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .interactive-checklist input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #10b981;
      cursor: pointer;
    }

    .norm-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .prose h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-top: 0;
      margin-bottom: 12px;
    }

    .prose h2 {
      font-size: 22px;
      margin-top: 32px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 13.5px;
    }

    .prose th, .prose td {
      border: 1px solid var(--color-border);
      padding: 10px 14px;
      text-align: left;
    }

    .prose th {
      background: var(--color-surface);
      font-weight: 700;
    }

    .callout-pro {
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid #38bdf8;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin: 18px 0;
      font-size: 13.5px;
    }

    .search-doc-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 13px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .search-doc-input:focus {
      border-color: #38bdf8;
      outline: none;
    }

    @media print {
      .doc-nav-header, .doc-sidebar, .role-selector-bar, .no-print {
        display: none !important;
      }
      .doc-content {
        padding: 0 !important;
        max-width: 100% !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
      .glitter-step-card {
        border: 1px solid #ccc !important;
        break-inside: avoid;
      }
    }
  </style>
</head>

  <!-- LAYOUT -->

      <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--color-border)">

        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="doc-content">
      
      <!-- SÉLECTEUR RAPIDE SUPÉRIEUR -->
      <div class="role-selector-bar no-print">
        <span style="font-size:12.5px;font-weight:700;color:var(--color-text-dim);align-self:center;margin-right:4px">

        </span>
        <button type="button" class="role-pill-btn active" onclick="selectionnerRole('notaire')">👑 Notaire</button>
        <button type="button" class="role-pill-btn" onclick="selectionnerRole('premier_clerc')">👔 1er Clerc</button>
        <button type="button" class="role-pill-btn" onclick="selectionnerRole('clerc_redacteur')">✍️ Rédacteur</button>
        <button type="button" class="role-pill-btn" onclick="selectionnerRole('comptable')">💳 Comptable</button>
        <button type="button" class="role-pill-btn" onclick="selectionnerRole('formaliste')">🏛️ Formaliste</button>
        <button type="button" class="role-pill-btn" onclick="selectionnerRole('archiviste')">📦 Archiviste</button>
      </div>

      <!-- CONTENU DYNAMIQUE PAR RÔLE -->
      <div id="conteneur-guide-role">
        <!-- Rempli dynamiquement par renderRoleGuide() -->
      </div>

    </main>
  </div>

    var roleActuel = 'notaire';

    function selectionnerRole(roleKey, btnElement) {
      roleActuel = roleKey;
      var data = GUIDES_PAR_ROLE[roleKey];
      if (!data) return;

      // Mise à jour des boutons actifs
      document.querySelectorAll('.role-pill-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        document.querySelectorAll('.role-pill-btn').forEach(function(btn) {
          if (btn.textContent.toLowerCase().includes(data.roleLabel.toLowerCase().split(' ')[0])) {
            btn.classList.add('active');
          }
        });
      }

      renderRoleGuide(data);
    }

    function renderRoleGuide(data) {
      var conteneur = document.getElementById("conteneur-guide-role");
      if (!conteneur) return;

      var html = '';

      // En-tête du rôle
      html += '<div style="margin-bottom:28px">';
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
      html += '<span class="norm-badge">' + data.badge + '</span>';
      html += '<span style="font-size:12px;color:var(--color-text-dim)">Norme ISO/IEC/IEEE 26514:2022</span>';
      html += '</div>';
      html += '<h1 style="margin:0 0 10px 0;font-family:\'Playfair Display\',serif;font-size:30px;color:var(--color-text)">';
      html += data.roleIcon + ' ' + data.roleLabel;
      html += '</h1>';
      html += '<p style="font-size:14.5px;color:var(--color-text-dim);margin:0;line-height:1.6">' + data.resume + '</p>';
      html += '</div>';

      // Alert info Glitter
      html += '<div class="callout-pro">';
      html += '<strong>✨ Guide d\'Action Pas à Pas :</strong> Suivez les étapes ci-dessous dans l\'ordre chronologique pour accomplir vos missions quotidiennes sur <em>Legal Notary ERP</em> avec une conformité totale.';
      html += '</div>';

      // Étapes Glitter
      data.steps.forEach(function(step) {
        html += '<div class="glitter-step-card">';
        html += '<div class="step-header">';
        html += '<div class="step-number-badge">' + step.num + '</div>';
        html += '<h2 class="step-title">' + step.title + '</h2>';
        html += '</div>';

        html += '<p style="font-size:14px;color:var(--color-text);margin-bottom:12px">' + step.desc + '</p>';

        html += '<div style="font-size:13px;font-weight:600;color:#38bdf8;margin-bottom:8px">🎯 Action Requise : ' + step.action + '</div>';

        if (step.mockup) {
          html += '<div class="step-screenshot-mockup">';
          html += '<div style="font-size:10.5px;text-transform:uppercase;color:#64748b;margin-bottom:6px">Aperçu Visuel Écran ERP :</div>';
          html += '<div>' + step.mockup + '</div>';
          html += '</div>';
        }

        if (step.checklist && step.checklist.length > 0) {
          html += '<div style="font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-dim);margin-top:14px">Checklist de Conformité à Cocher :</div>';
          html += '<ul class="interactive-checklist">';
          step.checklist.forEach(function(chk, idx) {
            var chkId = 'chk-' + roleActuel + '-' + step.num + '-' + idx;
            html += '<li onclick="toggleCheckbox(\'' + chkId + '\')">';
            html += '<input type="checkbox" id="' + chkId + '" onclick="event.stopPropagation()">';
            html += '<label for="' + chkId + '" style="cursor:pointer">' + chk + '</label>';
            html += '</li>';
          });
          html += '</ul>';
        }

        html += '</div>';
      });

      // Pied de page du guide
      html += '<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center">';
      html += '<div style="font-size:13px;color:var(--color-text-dim)">Besoin d\'aide sur ce module ? Contactez votre référent interne ou le support 24/7.</div>';
      html += '<button type="button" onclick="imprimerManuelRole()" class="btn btn-secondary" style="padding:8px 16px;font-size:13px;cursor:pointer">🖨️ Imprimer la Fiche ' + data.roleLabel.split(' ')[0] + '</button>';
      html += '</div>';

      conteneur.innerHTML = html;
    }

    function toggleCheckbox(id) {
      var el = document.getElementById(id);
      if (el) el.checked = !el.checked;
    }

    function imprimerManuelRole() {
      window.print();
    }

    function filtrerDocumentation(texte) {
      if (!texte) return;
      texte = texte.toLowerCase().trim();
      var foundRole = null;
      Object.keys(GUIDES_PAR_ROLE).forEach(function(key) {
        var g = GUIDES_PAR_ROLE[key];
        if (g.roleLabel.toLowerCase().includes(texte) || g.resume.toLowerCase().includes(texte)) {
          foundRole = key;
        }
        g.steps.forEach(function(st) {
          if (st.title.toLowerCase().includes(texte) || st.desc.toLowerCase().includes(texte)) {
            foundRole = key;
          }
        });
      });

      if (foundRole && foundRole !== roleActuel) {
        selectionnerRole(foundRole);
      }
    }

  </script>
