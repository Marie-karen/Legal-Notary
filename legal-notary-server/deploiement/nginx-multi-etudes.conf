# ==============================================================================
# CONFIGURATION NGINX MULTI-ÉTUDES & MULTI-DOMAINES — LEGAL NOTARY ERP
# ==============================================================================

# 1. Limitation du débit pour contrer les attaques DDoS (Zero-Latency Protect)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# 2. Configuration du serveur Reverse Proxy
server {
    listen 80;
    listen [::]:80;

    # Noms de domaine acceptés : sous-domaines illimités et domaines personnalisés
    server_name ~^(?<subdomain>.+)\.legalnotary\.app$ notaire-kouassi.ci etude-diallo.com _;

    # Redirection vers HTTPS gérée par Certbot Let's Encrypt
    # (Décommenté automatiquement après 'sudo certbot --nginx')

    # Taille max d'upload pour les scans de minutes et pièces volumineuses
    client_max_body_size 50M;

    # Compression GZIP pour accélération maximale (< 2 ms)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Fichiers statiques et Web App avec cache rapide
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts optimisés
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API avec rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
