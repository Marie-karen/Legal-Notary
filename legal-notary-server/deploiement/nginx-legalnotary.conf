# nginx-legalnotary.conf — reverse proxy HTTPS devant le serveur Legal
# Notary. Le serveur Node (legalnotary.service) écoute en HTTP simple sur
# 127.0.0.1:4000, jamais exposé directement sur Internet : nginx gère le
# HTTPS (via Certbot/Let's Encrypt, gratuit) et transmet les requêtes en
# interne. Voir ../docs/DEPLOIEMENT.md pour le contexte complet.
#
# Installation (une fois, sur un serveur Ubuntu/Debian typique) :
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. Remplacer "etude-exemple.ci" ci-dessous par le vrai nom de domaine
#      du cabinet (il doit déjà pointer vers ce serveur — configuration
#      chez le registrar du domaine, pas ici).
#   3. sudo cp nginx-legalnotary.conf /etc/nginx/sites-available/legalnotary
#   4. sudo ln -s /etc/nginx/sites-available/legalnotary /etc/nginx/sites-enabled/
#   5. sudo nginx -t   (vérifie la config avant de l'activer)
#   6. sudo systemctl reload nginx
#   7. sudo certbot --nginx -d etude-exemple.ci
#      (Certbot réécrit ce fichier automatiquement pour ajouter le HTTPS
#      et programme le renouvellement du certificat tous les 90 jours —
#      rien à faire manuellement ensuite.)

server {
    listen 80;
    server_name etude-exemple.ci;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Taille max d'une requête (pièces jointes de projet d'acte, etc.) —
    # ajuster si le cabinet a besoin de téléverser des fichiers plus gros.
    client_max_body_size 20M;
}
